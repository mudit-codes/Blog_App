{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 text-center">
  <h1 class="display-5">Welcome to Flask Blog 🚀</h1>
  <p class="lead">A small portfolio-ready blog built with Flask.</p>
  <a class="btn btn-primary" href="{{ url_for('blog') }}">Read Posts</a>
</div>

<h3>Latest Posts</h3>
<div class="row">
  {% for post in posts %}
  <div class="col-md-6">
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ post.title }}</h5>
        <p class="card-text text-truncate">{{ post.content }}</p>
        <a href="{{ url_for('post_view', post_id=post.id) }}" class="btn btn-sm btn-outline-primary">Read</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
