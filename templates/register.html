{% extends "base.html" %}
{% block content %}
<h2>Register</h2>
<form method="post">
  <div class="mb-3"><input class="form-control" name="username" placeholder="Username" required></div>
  <div class="mb-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div>
  <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password (min 6 chars)" required></div>
  <button class="btn btn-primary" type="submit">Register</button>
</form>
{% endblock %}
